[package]
name = "parley"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Checker and elaborator for the readable proof layer over Metamath"
publish = false

[lib]
name = "parley"
path = "src/lib.rs"

[[bin]]
name = "parley"
path = "src/main.rs"

[dependencies]
annotate-snippets = "0.11"
fancy-regex = "0.17"
indexmap = "2"
# From the repository, because the v0.3.9 tag has the fix for a slice index
# out of bounds in its verifier (metamath-knife #159) and crates.io has only
# 0.3.8, from before it.
metamath-rs = { git = "https://github.com/metamath/metamath-knife", tag = "v0.3.9", default-features = false }
nix = { version = "0.30", default-features = false, features = ["resource"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
regex = "1"
rustc-hash = "2.1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
unicode_names2 = "1"

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
# The tests run in this profile (`scripts/precommit.sh`), and an overflow is
# a fault to stop at there and in the tools alike.
overflow-checks = true
incremental = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
