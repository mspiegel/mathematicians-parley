[package]
name = "parley"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Checker and elaborator for the readable proof layer over Metamath"
publish = false

[lib]
name = "parley"
path = "src/lib.rs"

[[bin]]
name = "parley"
path = "src/main.rs"

[dependencies]
annotate-snippets = "0.11"
fancy-regex = "0.17"
indexmap = "2"
# 0.3.9 has the fix for a slice index out of bounds in its verifier
# (metamath-knife #159), which 0.3.8 panics on in a debug build.
metamath-rs = { version = "0.3.9", default-features = false }
nix = { version = "0.30", default-features = false, features = ["resource"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
regex = "1"
rustc-hash = "2.1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
unicode_names2 = "1"

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
# The tests run in this profile (`scripts/precommit.sh`), and an overflow is
# a fault to stop at there and in the tools alike.
overflow-checks = true
# Not incremental. On macOS the debug info stays in the object files, which
# the binaries point to and nothing removes; incremental names them anew at
# each build, and one changed line left 1,110 more (about 1 GB). Measured
# 2026-10-18 on a clean directory: a rebuild after a change takes 47s
# against 20s incremental, the branch test run 36s against 39s, and none
# accumulate.
incremental = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
