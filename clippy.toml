# Output is compared byte for byte, and a search that takes the first lemma
# that fits takes a different one when a map iterates in a different order.
# A std hash map iterates in an order that changes from run to run, so none is
# used: an insertion-ordered map where Python kept insertion order, a BTree
# where the order is sorted.
# The ways text becomes a tree, and the readings of items and definitions
# made from it. The checker reads the page and what it cites once, and the
# build takes those trees, sorts and definitions from its record and parses
# nothing (`ELABORATION.md`, "The checker reads the page"), so `src/elab`
# denies these and the rest of the crate allows them (`Cargo.toml`).
disallowed-methods = [
    { path = "parley::formula::page::Sentence::read", reason = "the build takes a tree from the checker's record (`Elaborator::read`)" },
    { path = "parley::formula::page::Sentence::read_so_far", reason = "the build takes a tree from the checker's record (`Elaborator::read`)" },
    { path = "parley::corpus::values::Values::read", reason = "the build reads values by `Values::read_by` with its own reader" },
    { path = "parley::corpus::values::Values::read_wanted", reason = "the build reads values by `Values::read_wanted_by` with its own reader" },
    { path = "parley::sorts::introduction::Introduction::asserted", reason = "the build reads a let line by `Introduction::asserted_by` with its own reader" },
    { path = "parley::sorts::sorts_of_cited", reason = "the build takes a cited statement's sorts from the checker (`LibraryReading::cited`)" },
    { path = "parley::sorts::cited_statement", reason = "the build takes a cited statement from the checker (`LibraryReading::cited`)" },
    { path = "parley::sorts::sorts_of_statement", reason = "the build takes a cited statement from the checker (`LibraryReading::cited`)" },
    { path = "parley::sorts::sorts_of_record", reason = "the build takes a record's sorts from the checker (`LibraryReading::record_sorts`)" },
    { path = "parley::sorts::sorts_of_records", reason = "the build takes the records' sorts from the checker (`LibraryReading::record_sorts`)" },
    { path = "parley::sorts::statement_definitions", reason = "the build takes a statement's definitions from the checker (`CheckedTheorem::statement_definitions`)" },
    { path = "parley::sorts::file_definitions", reason = "the build takes the definitions from outside a theorem from the checker (`CheckedTheorem::outside`)" },
    { path = "parley::sorts::cited_defines", reason = "the build takes a citation's definitions from the checker's record" },
    { path = "parley::sorts::infer::read_statement", reason = "the build takes sorts from the checker's record" },
    { path = "parley::sorts::infer::read_record", reason = "the build takes sorts from the checker's record" },
    { path = "parley::citing::library::Library::new", reason = "the build's library takes every item's groups from the checker (`Library::read_by_checker`)" },
]
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order changes between runs; use indexmap::IndexMap or BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order changes between runs; use indexmap::IndexSet or BTreeSet" },
]
